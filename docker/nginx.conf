# Enterprise Agent OS — Nginx Reverse Proxy
# Use with: docker compose --profile production up

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=60r/m;

    # Upstream definitions
    upstream dashboard {
        server dashboard:3000;
    }

    upstream paperclip {
        server paperclip:9123;
    }

    upstream agent_runtime {
        server agent-runtime:8421;
    }

    # ── HTTP (redirect to HTTPS if certs available) ──────────

    server {
        listen 80;
        server_name _;

        # Dashboard
        location / {
            limit_req zone=dashboard burst=20 nodelay;
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Paperclip API
        location /api/paperclip/ {
            limit_req zone=api burst=10 nodelay;
            rewrite ^/api/paperclip/(.*) /$1 break;
            proxy_pass http://paperclip;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Agent Runtime API (internal only by default — restrict in production)
        location /api/agent-runtime/ {
            limit_req zone=api burst=10 nodelay;
            rewrite ^/api/agent-runtime/(.*) /$1 break;
            proxy_pass http://agent_runtime;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── HTTPS (if certificates are mounted) ──────────────────

    # server {
    #     listen 443 ssl;
    #     server_name your-enterprise-domain.com;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # ... same location blocks as above ...
    # }
}
